_schema-version: "3.3"
ID: axon-odata-api
version: 1.0.0
description: Axon warehouse CAP OData + approuter (Fiori via Work Zone)

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  - name: axon-odata-api
    type: nodejs
    path: gen/srv
    parameters:
      memory: 256M
      disk-quota: 512M
      command: >-
        rm -f axon-odata-api.db db.sqlite &&
        mkdir -p db/data &&
        cp -f ../pg/db/data/*.csv db/data/ &&
        ./node_modules/.bin/cds-deploy --to sqlite --profile production &&
        cp -f db.sqlite axon-odata-api.db &&
        npm start
    build-parameters:
      builder: npm
    requires:
      - name: axon-auth
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

  - name: axon-odata-api-app
    type: approuter.nodejs
    path: app/router
    parameters:
      memory: 256M
      disk-quota: 256M
    build-parameters:
      builder: npm
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
      - name: axon-auth
    provides:
      - name: app-api
        properties:
          app-url: ${default-url}

resources:
  - name: axon-auth
    type: org.cloudfoundry.existing-service

  # Uncomment after `cf create-service html5-apps-repo app-host axon-html5-host`
  # and `cf create-service html5-apps-repo app-runtime axon-html5-rt`, then add
  # html5-apps-repo-rt require on axon-odata-api-app and ui-deployer module.
