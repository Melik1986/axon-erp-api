_schema-version: "3.3"
ID: axon-odata-api
version: 1.0.0
description: Axon warehouse CAP OData + approuter (Fiori via Work Zone)

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
        - node scripts/patch-gen-srv.js
        - node scripts/patch-workzone-deployer.js

modules:
  - name: axon-odata-api
    type: nodejs
    path: gen/srv
    parameters:
      memory: 256M
      disk-quota: 512M
      command: >-
        rm -f axon-odata-api.db db.sqlite &&
        ./node_modules/.bin/cds-deploy --to sqlite &&
        cp -f db.sqlite axon-odata-api.db &&
        npm start
    build-parameters:
      builder: npm
    requires:
      - name: axon-auth
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

  - name: axon-odata-api-app
    type: approuter.nodejs
    path: app/router
    parameters:
      memory: 256M
      disk-quota: 256M
    build-parameters:
      builder: npm
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
      - name: axon-auth
      - name: axon-destination
      - name: axon-html5-rt
    provides:
      - name: app-api
        properties:
          app-url: ${default-url}

  - name: axon-warehouse-ops
    type: html5
    path: app/warehouse-ops
    build-parameters:
      builder: custom
      build-result: dist
      commands:
        - npm install
        - npm run build
      supported-platforms: []

  - name: axon-warehouse-ops-content
    type: com.sap.application.content
    path: app/warehouse-ops-content
    requires:
      - name: axon-html5-host
        parameters:
          content-target: true
    build-parameters:
      build-result: app-content
      requires:
        - name: axon-warehouse-ops
          artifacts:
            - warehouse-ops.zip
          target-path: app-content/

  - name: axon-destinations
    type: com.sap.application.content
    requires:
      - name: axon-destination
        parameters:
          content-target: true
      - name: axon-html5-host
        parameters:
          service-key:
            name: axon-html5-host-key
      - name: axon-auth
        parameters:
          service-key:
            name: axon-auth-key
      - name: srv-api
    build-parameters:
      no-source: true
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: axon-warehouse-ops-html5-repository
              ServiceInstanceName: axon-html5-host
              ServiceKeyName: axon-html5-host-key
              sap.cloud.service: axon.warehouse.ops
            - Name: axon-warehouse-ops-auth
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: axon-auth
              ServiceKeyName: axon-auth-key
              sap.cloud.service: axon.warehouse.ops

  # Portal content deployer: pushes CDM (cdm.json) to SAP Build Work Zone Standard
  # so that catalog, group, and site are created automatically on deploy.
  - name: axon-portal-deployer
    type: com.sap.portal.content
    path: app/workzone
    parameters:
      no-route: true
      health-check-type: none
      memory: 256M
      disk-quota: 512M
      tasks:
        - name: deploy
          memory: 256M
          command: npm start
    requires:
      - name: axon-launchpad
        parameters:
          content-target: true
      - name: axon-html5-rt

resources:
  - name: axon-auth
    type: org.cloudfoundry.existing-service

  # SAP Build Work Zone Standard — existing service instance created via BTP cockpit
  - name: axon-launchpad
    type: org.cloudfoundry.existing-service

  - name: axon-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        init_data:
          subaccount:
            existing_destinations_policy: update
            destinations:
              - Name: axon-workzone-runtime
                Authentication: NoAuthentication
                Type: HTTP
                ProxyType: Internet
                URL: https://590c8b3dtrial.dt.launchpad.cfapps.us10.hana.ondemand.com
                CEP.HTML5contentprovider: true
              - Name: srv-api
                Authentication: NoAuthentication
                Type: HTTP
                ProxyType: Internet
                URL: https://590c8b3dtrial-590c8b3dtrial-dev-axon-odata-api.cfapps.us10-001.hana.ondemand.com
                HTML5.DynamicDestination: true
                HTML5.ForwardAuthToken: true
                WebIDEUsage: odata_gen

  - name: axon-html5-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  - name: axon-html5-rt
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime

  # Uncomment after `cf create-service html5-apps-repo app-host axon-html5-host`
  # and `cf create-service html5-apps-repo app-runtime axon-html5-rt`, then add
  # html5-apps-repo-rt require on axon-odata-api-app and ui-deployer module.
  # - name: axon-html5-host
  #   type: org.cloudfoundry.managed-service
  #   parameters:
  #     service: html5-apps-repo
  #     service-plan: app-host
  # - name: axon-html5-rt
  #   type: org.cloudfoundry.managed-service
  #   parameters:
  #     service: html5-apps-repo
  #     service-plan: app-runtime
