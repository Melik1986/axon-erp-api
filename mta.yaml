_schema-version: "3.3"
ID: axon-odata-api
version: 1.0.0
description: Axon warehouse CAP OData + approuter (Fiori via Work Zone)

parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo

build-parameters:
  before-all:
    - builder: custom
      commands:
        - bash scripts/with-node24.sh npm ci
        - bash scripts/with-node24.sh sh -c 'npx cds build --production && node scripts/patch-gen-srv.js'
        - mkdir -p app/warehouse-ops-content/app-content

modules:
  - name: axon-odata-api-db-deployer
    type: hdb
    path: gen/db
    parameters:
      memory: 256M
      disk-quota: 512M
      buildpack: nodejs_buildpack
    requires:
      - name: axon-warehouse-hdi

  - name: axon-odata-api
    type: nodejs
    path: gen/srv
    parameters:
      memory: 512M
      disk-quota: 512M
      buildpack: nodejs_buildpack
      readiness-health-check-type: http
      readiness-health-check-http-endpoint: /health
      env:
        NODE_ENV: production
        CDS_ENV: production
    build-parameters:
      builder: npm
    requires:
      - name: axon-warehouse-hdi
      - name: axon-auth
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

  - name: axon-odata-api-app
    type: approuter.nodejs
    path: app/router
    parameters:
      memory: 256M
      disk-quota: 256M
    build-parameters:
      builder: npm
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
      - name: axon-auth
      - name: axon-destination
      - name: axon-html5-rt
    provides:
      - name: app-api
        properties:
          app-url: ${default-url}

  - name: axon-warehouse-ops
    type: html5
    path: app/warehouse-ops
    build-parameters:
      builder: custom
      build-result: dist
      commands:
        - npm install
        - npm run build
      supported-platforms: []

  - name: axon-warehouse-ops-content
    type: com.sap.application.content
    path: app/warehouse-ops-content
    requires:
      - name: axon-html5-host
        parameters:
          content-target: true
    build-parameters:
      build-result: app-content
      requires:
        - name: axon-warehouse-ops
          artifacts:
            - warehouse-ops.zip
          target-path: app-content/

  - name: axon-destinations
    type: com.sap.application.content
    requires:
      - name: axon-destination
        parameters:
          content-target: true
      - name: axon-html5-host
        parameters:
          service-key:
            name: axon-html5-host-key
      - name: axon-html5-rt
        parameters:
          service-key:
            name: axon-html5-rt-key
      - name: axon-auth
        parameters:
          service-key:
            name: axon-auth-key
      - name: srv-api
      - name: app-api
    build-parameters:
      no-source: true
    parameters:
      content:
        subaccount:
          existing_destinations_policy: update
          destinations:
            - Name: axon-warehouse-ops-html5-repository
              ServiceInstanceName: axon-html5-host
              ServiceKeyName: axon-html5-host-key
              sap.cloud.service: axon.warehouse.ops
            - Name: axon-warehouse-ops-html5-runtime
              ServiceInstanceName: axon-html5-rt
              ServiceKeyName: axon-html5-rt-key
            - Name: axon-warehouse-ops-auth
              URL: https://590c8b3dtrial-590c8b3dtrial-dev-axon-odata-api.cfapps.us10-001.hana.ondemand.com
              Authentication: OAuth2ClientCredentials
              TokenServiceInstanceName: axon-auth
              TokenServiceKeyName: axon-auth-key
              HTML5.DynamicDestination: true
              WebIDEEnabled: true
              WebIDEUsage: odata_gen
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: axon-warehouse-ops-auth
              Authentication: OAuth2ClientCredentials
              TokenServiceInstanceName: axon-auth
              TokenServiceKeyName: axon-auth-key
              URL: https://590c8b3dtrial-590c8b3dtrial-dev-axon-odata-api.cfapps.us10-001.hana.ondemand.com
              HTML5.DynamicDestination: true
              WebIDEEnabled: true
              WebIDEUsage: odata_gen

resources:
  - name: axon-auth
    type: org.cloudfoundry.existing-service

  - name: axon-warehouse-hdi
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: axon-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        init_data:
          subaccount:
            existing_destinations_policy: update
            destinations:
              - Name: srv-api
                Authentication: NoAuthentication
                Type: HTTP
                ProxyType: Internet
                URL: https://590c8b3dtrial-590c8b3dtrial-dev-axon-odata-api.cfapps.us10-001.hana.ondemand.com
                HTML5.DynamicDestination: true
                HTML5.ForwardAuthToken: true
                WebIDEUsage: odata_gen
              - Name: axon-warehouse-ops-auth
                Type: HTTP
                ProxyType: Internet
                URL: https://590c8b3dtrial-590c8b3dtrial-dev-axon-odata-api.cfapps.us10-001.hana.ondemand.com
                Authentication: OAuth2ClientCredentials
                TokenServiceInstanceName: axon-auth
                TokenServiceKeyName: axon-auth-key
                HTML5.DynamicDestination: true
                WebIDEEnabled: true
                WebIDEUsage: odata_gen
          instance:
            existing_destinations_policy: update
            destinations:
              - Name: srv-api
                Authentication: NoAuthentication
                Type: HTTP
                ProxyType: Internet
                URL: https://590c8b3dtrial-590c8b3dtrial-dev-axon-odata-api.cfapps.us10-001.hana.ondemand.com
                HTML5.DynamicDestination: true
                HTML5.ForwardAuthToken: true
                WebIDEUsage: odata_gen

  - name: axon-html5-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  - name: axon-html5-rt
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
