_schema-version: 3.3.0
ID: axon-erp-api
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: axon-erp-api-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: axon-erp-api-auth
      - name: axon-erp-api-db
      - name: axon-erp-api-postgres

  - name: axon-erp-api-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: axon-erp-api-db

  - name: axon-erp-api-postgres-deployer
    type: nodejs
    path: gen/pg
    parameters:
      buildpack: nodejs_buildpack
      no-route: true
      no-start: true
      tasks:
        - name: deploy-to-postgresql
          command: npm start
    requires:
      - name: axon-erp-api-postgres
  - name: axon-erp-api
    type: approuter.nodejs
    path: app/router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true
      - name: axon-erp-api-auth
      - name: axon-erp-api-html5-runtime
      - name: axon-erp-api-portal
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

  - name: axon-erp-api-app-deployer
    type: com.sap.application.content
    path: gen
    build-parameters:
      build-result: app/
      requires:
    requires:
      - name: axon-erp-api-auth
      - name: srv-api
      - name: axon-erp-api-html5-repo-host
        parameters:
          content-target: true
          config:
            HTML5Runtime_enabled: true

  - name: axon-erp-api-portal-deployer
    type: com.sap.application.content
    path: app/portal
    requires:
      - name: axon-erp-api-portal
        parameters:
          content-target: true
          service-key:
            name: axon-erp-api-portal-key
            config:
              content-endpoint: developer
      - name: axon-erp-api-auth
      - name: axon-erp-api-html5-repo-host
      - name: axon-erp-api-app-deployer
    deployed-after:
      - axon-erp-api-app-deployer

resources:
  - name: axon-erp-api-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: axon-erp-api-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
          redirect-uris:
            - https://*~{app-api/app-uri}/**
    requires:
      - name: app-api
  - name: axon-erp-api-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: axon-erp-api-postgres
    type: org.cloudfoundry.managed-service
    parameters:
      service: postgresql-db
      service-plan: development

  - name: axon-erp-api-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  - name: axon-erp-api-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
  - name: axon-erp-api-portal
    type: org.cloudfoundry.managed-service
    parameters:
      service: portal
      service-plan: standard
